name: Store and admin regression
on:
  push:
    branches: [fix/store-admin-ux]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ux-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
