name: Build Ritm Android APK
on:
  push:
    branches: [codex/ritm-android]
    paths:
      - 'ritm-android/**'
      - '.github/workflows/ritm-android.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ritm-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile, unit-test and lint Android
        working-directory: ritm-android
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install UI test tools
        working-directory: ritm-android/web-tests
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: ritm-android/web-tests
        run: npx playwright install --with-deps chromium
      - name: Test user flows
        working-directory: ritm-android/web-tests
        run: npm test
      - name: Prepare deliverables
        if: success()
        run: |
          mkdir -p ritm-output
          cp ritm-android/app/build/outputs/apk/debug/app-debug.apk ritm-output/Ritm-1.0.0.apk
          cd ritm-output
          sha256sum Ritm-1.0.0.apk > SHA256SUMS.txt
          cd ..
          git archive --format=zip HEAD ritm-android .github/workflows/ritm-android.yml > ritm-output/Ritm-source.zip
      - name: APK and source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ritm-Android-1.0.0
          path: ritm-output/
          retention-days: 30
      - name: UI screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ritm-test-reports
          path: |
            ritm-android/web-tests/screenshots/
            ritm-android/web-tests/report/
            ritm-android/web-tests/test-results/
            ritm-android/app/build/reports/
          retention-days: 14
