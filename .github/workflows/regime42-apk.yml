name: Build Regime42 APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          cat .github/regime42_payload/p00 .github/regime42_payload/p01 .github/regime42_payload/p02 .github/regime42_payload/p03 .github/regime42_payload/p04 .github/regime42_payload/p05 > /tmp/regime42.b64
          test "$(wc -c < /tmp/regime42.b64)" -eq 23716
          base64 -d /tmp/regime42.b64 > /tmp/regime42.zip
          echo "4df982241f04f412b0c01885ed547d5506b847d77b4d6a24bf3648b7df8b8a34  /tmp/regime42.zip" | sha256sum -c -
          unzip -q /tmp/regime42.zip -d /tmp/build
          test -f /tmp/build/regime42_android/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: /tmp/build/regime42_android
        run: gradle --no-daemon assembleDebug

      - name: Prepare artifact
        shell: bash
        run: |
          cp /tmp/build/regime42_android/app/build/outputs/apk/debug/app-debug.apk /tmp/Regime-4-2.apk
          unzip -t /tmp/Regime-4-2.apk >/dev/null
          ls -lh /tmp/Regime-4-2.apk
          sha256sum /tmp/Regime-4-2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Regime-4-2-APK
          path: /tmp/Regime-4-2.apk
          if-no-files-found: error
